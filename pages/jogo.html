<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memória</title>
    <link rel="stylesheet" href="../css/jogo/jogo.css" />
    <link rel="stylesheet" href="../css/jogo/modal.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  </head>
  <body data-theme="light">
    <div class="header-flex">
      <header>
        <button onclick="history.back()">
          <i class="material-icons">arrow_back</i>
        </button>

        <span
          >Tentativas:
          <div id="counter">0</div>
        </span>

        <button type="button" id="reset">Reiniciar</button>
        <button type="button" id="theme">Alterar Tema</button>
        <button type="button" id="giveUp">Desistir</button>
      </header>
    </div>

    <main>
      <section class="board" id="board">
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
        <button class="card" id="card">?</button>
      </section>
    </main>

    <div id="modal" class="modal">
      <div class="content">
        <div>
          <h1>Parabéns!</h1>
          <p>Todas as cartas foram abertas:</p>
        </div>
        <div class="result-row">
          <div>Tentativas:</div>
          <div id="attempt-results"></div>

          <div>Tempo:</div>
          <div id="time-results"></div>
        </div>

        <div class="text-row">
          <div>Insira seu nome: <input type="text" id="winner" /></div>
        </div>

        <div class="button-row">
          <button>Reiniciar</button> <button>Salvar</button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/main.js"></script>
  </body>
</html>
